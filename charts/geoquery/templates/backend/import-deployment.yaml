apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoquery-import
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoquery-import
  template:
    metadata:
      labels:
        app: geoquery-import
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.import.runAsUser | default .Values.volumes.requests.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.backend.import.runAsGroup | default .Values.volumes.requests.runAsGroup | default 1000 }}
      containers:
        - name: django
          image: {{ .Values.backend.image }}
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            {{- include "geoquery.secretEnv" (dict "name" "DJANGO_SECRET_KEY" "ref" .Values.django.secretKey) | nindent 12 }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            {{- include "geoquery.secretEnv" (dict "name" "EMAIL_PASSWORD" "ref" .Values.geoquery.emailPassword) | nindent 12 }}
            {{- include "geoquery.secretEnv" (dict "name" "GITHUB_GIST_TOKEN" "ref" .Values.geoquery.githubGistToken) | nindent 12 }}
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: REQUESTS_DIR
              value: "/requests"
            - name: PG_RW_HOST
              {{- if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{.Values.protomaps.key }}
            - name: RABBITMQ_HOST
              value: "geoquery-rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: password
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
            {{- if .Values.metrics.enabled }}
            - name: PROMETHEUS_ENABLED
              value: "true"
            {{- end }}
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "12000Mi"
              cpu: "2000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-data
              mountPath: /data
              readOnly: false
            - name: geoquery-requests
              mountPath: /requests
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-data
          persistentVolumeClaim:
            claimName: geoquery-data
            readOnly: false
        - name: geoquery-requests
          persistentVolumeClaim:
            claimName: geoquery-requests
