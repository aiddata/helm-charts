apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoquery-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: geoquery-backend
  template:
    metadata:
      labels:
        app: geoquery-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.volumes.requests.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.volumes.requests.runAsGroup | default 1000 }}
      containers:
        - name: django
          image: {{ .Values.backend.image }}
          command: ["/app/.venv/bin/uvicorn", "geoquery.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            - name: DJANGO_SECRET_KEY
              value: {{ .Values.django.secretKey }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            - name: EMAIL_PASSWORD
              value: {{ .Values.django.emailPassword | quote }}
            {{- if .Values.django.csrfTrustedOrigins }}
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: {{ .Values.django.csrfTrustedOrigins | quote }}
            {{- end }}
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: REQUESTS_DIR
              value: "/requests"
            - name: PG_RW_HOST
              {{- if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            # Read-only replica target. Falls back to the primary when the ro
            # pooler is disabled, so reads simply go where they always did.
            - name: PG_RO_HOST
              {{- if and .Values.database.pooler.enabled .Values.database.pooler.ro.enabled }}
              value: geoquery-db-pooler-ro
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RO_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RO_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RO_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{.Values.protomaps.key }}
            - name: RABBITMQ_HOST
              value: "geoquery-rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: password
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
            {{- if .Values.metrics.enabled }}
            - name: PROMETHEUS_ENABLED
              value: "true"
            {{- end }}
          resources:
            requests:
              memory: "3500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-requests
              mountPath: /requests
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9091
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-requests
          persistentVolumeClaim:
            claimName: geoquery-requests
