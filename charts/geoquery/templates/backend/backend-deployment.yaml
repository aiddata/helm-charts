apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoquery-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: geoquery-backend
  template:
    metadata:
      labels:
        app: geoquery-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.volumes.requests.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.volumes.requests.runAsGroup | default 1000 }}
      containers:
        - name: django
          image: {{ .Values.backend.image }}
          command: ["/app/.venv/bin/uvicorn", "geoquery.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            {{- include "geoquery.secretEnv" (dict "name" "DJANGO_SECRET_KEY" "ref" .Values.django.secretKey) | nindent 12 }}
            - name: DJANGO_ALLOWED_HOSTS
              {{- if .Values.mcp.enabled }}
              # The MCP server calls the OIDC token and JWKS endpoints on this
              # Service's in-cluster name (see mcp-deployment.yaml's
              # MCP_OIDC_INTERNAL_URL), so Django must accept that Host too.
              value: {{ printf "%s,geoquery-backend.%s.svc.cluster.local" .Values.django.allowedHosts .Release.Namespace | quote }}
              {{- else }}
              value: {{ .Values.django.allowedHosts }}
              {{- end }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            {{- include "geoquery.secretEnv" (dict "name" "EMAIL_PASSWORD" "ref" .Values.geoquery.emailPassword) | nindent 12 }}
            {{- include "geoquery.secretEnv" (dict "name" "GITHUB_GIST_TOKEN" "ref" .Values.geoquery.githubGistToken) | nindent 12 }}
            {{- include "geoquery.secretEnv" (dict "name" "GITHUB_OAUTH_CLIENT_ID" "ref" .Values.geoquery.githubOauthClientId) | nindent 12 }}
            {{- include "geoquery.secretEnv" (dict "name" "GITHUB_OAUTH_CLIENT_SECRET" "ref" .Values.geoquery.githubOauthClientSecret) | nindent 12 }}
            {{- if .Values.mcp.enabled }}
            # GeoQuery's OIDC provider, which signs MCP users in. The MCP_*
            # values let `manage.py ensure_mcp_oidc_client` be re-run by hand
            # from this pod; the migration Job already runs it on every deploy.
            {{- include "geoquery.secretEnv" (dict "name" "OIDC_PRIVATE_KEY" "ref" .Values.geoquery.oidcPrivateKey) | nindent 12 }}
            - name: MCP_BASE_URL
              value: {{ include "geoquery.mcpBaseUrl" . | quote }}
            - name: MCP_OIDC_CLIENT_ID
              value: {{ .Values.mcp.oidcClientId | quote }}
            {{- include "geoquery.secretEnv" (dict "name" "MCP_OIDC_CLIENT_SECRET" "ref" .Values.mcp.oidcClientSecret) | nindent 12 }}
            {{- end }}
            {{- if .Values.django.csrfTrustedOrigins }}
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: {{ .Values.django.csrfTrustedOrigins | quote }}
            {{- end }}
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: REQUESTS_DIR
              value: "/requests"
            # Dedicated pooler (see database/pooler.yaml) so processing/
            # background load on the shared pooler-rw pool can't starve the
            # API of a connection slot. Falls back to the shared rw pooler,
            # then to the primary directly, if the dedicated pooler is off.
            - name: PG_RW_HOST
              {{- if and .Values.database.pooler.enabled .Values.database.pooler.api.enabled }}
              value: geoquery-db-pooler-api
              {{- else if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            # Read-only replica target. Falls back to the primary when the ro
            # pooler is disabled, so reads simply go where they always did.
            - name: PG_RO_HOST
              {{- if and .Values.database.pooler.enabled .Values.database.pooler.ro.enabled }}
              value: geoquery-db-pooler-ro
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RO_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RO_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RO_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{.Values.protomaps.key }}
            - name: RABBITMQ_HOST
              value: "geoquery-rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: password
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
            {{- if .Values.metrics.enabled }}
            - name: PROMETHEUS_ENABLED
              value: "true"
            {{- end }}
          resources:
            requests:
              memory: "3500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-requests
              mountPath: /requests
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9091
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-requests
          persistentVolumeClaim:
            claimName: geoquery-requests
