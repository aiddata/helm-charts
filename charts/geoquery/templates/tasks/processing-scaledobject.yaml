{{- if .Values.tasks.processing.autoscaling.enabled }}
{{- $autoscaling := .Values.tasks.processing.autoscaling }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: processing-worker-postgres
  namespace: {{ .Release.Namespace }}
spec:
  # The password comes from the Secret CloudNativePG generates for the
  # application user, so it never appears in the ScaledObject or in Helm's
  # release history.
  secretTargetRef:
    - parameter: password
      name: geoquery-db-app
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: processing-worker
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    name: processing-worker
  minReplicaCount: {{ $autoscaling.minReplicas }}
  maxReplicaCount: {{ $autoscaling.maxReplicas }}
  # Cadence of the count query. The trigger caches the result and the HPA
  # reads the cache on its own sync cycle, so the HPA's own sync rate does not
  # add queries. Note this only holds while the query finishes inside the
  # interval -- a query that outlives pollingInterval overlaps with the next
  # one (observed: 115s query vs 30s interval put 2 independent backends on a
  # replica at once). The bounded query below is what keeps that true.
  pollingInterval: {{ $autoscaling.pollingInterval }}
  {{- if eq (int $autoscaling.minReplicas) 0 }}
  # Only consulted on the scale-to-zero path; KEDA warns it is inert otherwise.
  cooldownPeriod: {{ $autoscaling.cooldownPeriod }}
  {{- end }}
  advanced:
    # Leave the Deployment at its current replica count if the ScaledObject
    # is removed. The alternative restores the count KEDA observed when it
    # took over -- which, because Helm drops `replicas` from the manifest
    # while autoscaling is on, is the API default of 1, not replicaCount.
    # The next Helm upgrade with autoscaling off puts replicaCount back.
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        # Backlog is the reason to add workers, so add them promptly.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: {{ $autoscaling.scaleUp.podsPerPeriod }}
              periodSeconds: {{ $autoscaling.scaleUp.periodSeconds }}
        # Removing a worker interrupts up to `concurrency` in-flight tasks, so
        # shed capacity slowly and only after the backlog has stayed low for a
        # while. One pod at a time keeps the drain cost bounded.
        scaleDown:
          stabilizationWindowSeconds: {{ $autoscaling.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ $autoscaling.scaleDown.periodSeconds }}
  triggers:
    - type: postgresql
      useCachedMetrics: true
      authenticationRef:
        name: processing-worker-postgres
      metadata:
        host: {{ include "geoquery.processingAutoscaling.dbHost" . }}
        port: "5432"
        userName: {{ $autoscaling.postgres.userName | quote }}
        dbName: {{ $autoscaling.postgres.dbName | quote }}
        sslmode: {{ $autoscaling.postgres.sslmode | quote }}
        # Pending extract tasks, served by the partial index from analytics
        # migration 0014. Rows already claimed for dispatch (status 3) are
        # deliberately left out.
        #
        # Bounded on purpose. An unbounded count(*) has to tally every matching
        # index entry, so its cost grows with the backlog it is measuring --
        # i.e. it gets slowest exactly when the system is busiest. At 651M
        # pending it took 115s on a read replica (and over 9min on the primary
        # under write load) against a 30s pollingInterval, so counts overlapped
        # and ran back-to-back, burning replica IO the website reads need.
        #
        # LIMIT lets the scan stop early: the planner satisfies it from the
        # first partition and reports `never executed` for the other 56, so the
        # work is bounded by the LIMIT rather than by the backlog. Same replica,
        # same moment: 6.9ms execution against the unbounded query's 115s, on
        # ~10k buffers that were all cache hits.
        #
        # The bound is maxReplicas * pendingTasksPerReplica, which is the exact
        # point at or above which the HPA pins to maxReplicas. So the scaling
        # decision is unchanged: any backlog big enough to saturate still
        # saturates. Below the bound no truncation happens and the count is
        # exact, which is the only range where the precise value changes the
        # replica count -- and where it is cheap anyway.
        query: "SELECT count(*) FROM (SELECT 1 FROM extract_tasks WHERE status = 0 LIMIT {{ mul (int $autoscaling.maxReplicas) (int $autoscaling.pendingTasksPerReplica) }}) z"
        # Target average per replica: the HPA sizes to ceil(count / value).
        targetQueryValue: {{ $autoscaling.pendingTasksPerReplica | quote }}
{{- end }}
