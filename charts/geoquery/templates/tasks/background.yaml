apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.tasks.background.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: geoquery-background-worker
  template:
    metadata:
      labels:
        app: geoquery-background-worker
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.volumes.requests.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.volumes.requests.runAsGroup | default 1000 }}
      containers:
        - name: celery-worker
          image: {{ .Values.backend.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/app/.venv/bin/celery"]
          args:
            - "-A"
            - "geoquery"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "background"
            - "--concurrency={{ .Values.tasks.background.concurrency }}"
            - "--max-tasks-per-child=100"
          resources:
            {{- toYaml .Values.tasks.background.resources | nindent 12 }}
          env:
            - name: N_EXTRACT_TASK_BUILDERS
              value: "{{ .Values.tasks.background.extractTaskBuilders }}"
            - name: EXTRACT_TASK_BUILD_BATCH_SIZE
              value: {{ .Values.tasks.background.extractTaskBuildBatchSize | quote }}
            - name: EXTRACT_TASK_BUILD_MAX_TASKS
              value: {{ .Values.tasks.background.extractTaskBuildMaxTasks | quote }}
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            {{- include "geoquery.secretEnv" (dict "name" "DJANGO_SECRET_KEY" "ref" .Values.django.secretKey) | nindent 12 }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            {{- include "geoquery.secretEnv" (dict "name" "GITHUB_GIST_TOKEN" "ref" .Values.geoquery.githubGistToken) | nindent 12 }}
            - name: REQUESTS_DIR
              value: "/requests"
            - name: PG_RW_HOST
              {{- if and .Values.database.pooler.enabled .Values.database.pooler.tasks.enabled }}
              value: geoquery-db-pooler-tasks
              {{- else if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            # Read-only replica target, for build_stats_report's full-partition
            # scans. Without these the "replica" alias silently falls back to
            # PG_RW_* and the scans land on the primary. Falls back to the
            # primary here too when the ro pooler is disabled.
            - name: PG_RO_HOST
              {{- if and .Values.database.pooler.enabled .Values.database.pooler.ro.enabled }}
              value: geoquery-db-pooler-ro
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RO_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RO_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RO_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{ .Values.protomaps.key }}
            - name: RABBITMQ_HOST
              value: "geoquery-rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: password
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-requests
              mountPath: /requests
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-requests
          persistentVolumeClaim:
            claimName: geoquery-requests
