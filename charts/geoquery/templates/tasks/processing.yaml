apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.tasks.processing.autoscaling.enabled }}
  replicas: {{ .Values.tasks.processing.replicaCount }}
  {{- end }}
  # There is no readiness probe, so a new pod is Ready as soon as it starts.
  # Hold each one for a bit before moving on, so a rollout replaces workers
  # gradually instead of in a few near-instant waves.
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: geoquery-processing-worker
  template:
    metadata:
      labels:
        app: geoquery-processing-worker
    spec:
      # On SIGTERM the extract worker finishes the task each process is on and
      # releases the rest of its chunk to pending, so this only has to cover
      # one task per process.
      terminationGracePeriodSeconds: {{ .Values.tasks.processing.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.tasks.processing.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: extract-worker
          image: {{ .Values.backend.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Python itself is PID 1 and handles SIGTERM (no shell in between).
          command: ["/app/.venv/bin/python", "/app/backend/manage.py", "run_extract_worker"]
          args:
            - "--concurrency={{ .Values.tasks.processing.concurrency | default 1 }}"
            - "--max-chunks-per-child={{ .Values.tasks.processing.maxTasksPerChild }}"
            - "--idle-seconds={{ .Values.tasks.processing.idleSeconds }}"
          resources:
            {{- toYaml .Values.tasks.processing.resources | nindent 12 }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: 9091
          {{- end }}
          env:
            - name: EXTRACT_TASK_CLAIM_BATCH
              value: "{{ .Values.tasks.processing.claimBatch }}"
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            {{- include "geoquery.secretEnv" (dict "name" "DJANGO_SECRET_KEY" "ref" .Values.django.secretKey) | nindent 12 }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: PG_RW_HOST
              {{- if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{ .Values.protomaps.key }}
            {{- if .Values.metrics.enabled }}
            # The extract worker's parent serves the extract task metrics on
            # 9091, summed from per-process files its children write under
            # PROMETHEUS_MULTIPROC_DIR (created on start, inside the /tmp
            # emptyDir). PROMETHEUS_ENABLED stays unset here: django-prometheus's
            # own exporter would run in the parent and miss the children.
            - name: WORKER_METRICS_PORT
              value: "9091"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-data
          persistentVolumeClaim:
            claimName: geoquery-data
            readOnly: true
