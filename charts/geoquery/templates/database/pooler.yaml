{{- if .Values.database.pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: geoquery-db-pooler-rw
  namespace: {{ .Release.Namespace }}
spec:
  cluster:
    name: geoquery-db
  instances: {{ .Values.database.pooler.rw.instances }}
  type: rw
  pgbouncer:
    poolMode: {{ .Values.database.pooler.poolMode }}
    parameters:
      {{- toYaml .Values.database.pooler.parameters | nindent 6 }}
  template:
    spec:
      # containers is a required field; the container must be named "pgbouncer"
      containers:
        - name: pgbouncer
          resources:
            {{- toYaml .Values.database.pooler.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: geoquery-db-pooler-rw
                topologyKey: kubernetes.io/hostname
        {{- with .Values.database.pooler.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- if .Values.database.pooler.ro.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: geoquery-db-pooler-ro
  namespace: {{ .Release.Namespace }}
spec:
  cluster:
    name: geoquery-db
  instances: {{ .Values.database.pooler.ro.instances }}
  # Points at the geoquery-db-ro service, which selects replicas only
  type: ro
  pgbouncer:
    poolMode: {{ .Values.database.pooler.poolMode }}
    parameters:
      {{- toYaml .Values.database.pooler.parameters | nindent 6 }}
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            {{- toYaml .Values.database.pooler.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: geoquery-db-pooler-ro
                topologyKey: kubernetes.io/hostname
        {{- with .Values.database.pooler.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
{{- end }}
