{{- if .Values.metrics.enabled }}
{{- if .Values.metrics.podMonitor.enabled }}
{{- if .Values.database.pooler.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- /*
  One PodMonitor covering every Pooler in pooler.yaml (rw, ro, api, tasks).
  There used to be one per Pooler, kept in step with pooler.yaml by hand, and
  api and tasks were never added -- they were only scraped by accident,
  through the database PodMonitor's selector, which now excludes poolers.

  Which pooler a series came from is the `pooler` label (rw, ro, api, tasks),
  so panels can group on it rather than parsing job or pod names.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: geoquery-db-pooler
  namespace: {{ .Release.Namespace }}
  labels:
    app: geoquery-db-pooler
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: geoquery-db
      cnpg.io/podRole: pooler
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
          regex: geoquery-db-pooler-(.+)
          targetLabel: pooler
{{- end }}
{{- end }}
{{- end }}
{{- end }}
