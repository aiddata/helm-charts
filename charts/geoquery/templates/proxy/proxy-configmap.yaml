{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: geoquery-proxy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: geoquery-proxy
data:
  nginx.conf: |
    # Reverse proxy fronting the GeoQuery app. It is the single entry point
    # for external traffic and routes each request to either the frontend
    # (UI) or the backend (API/admin) service based on the request path.
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;

      # readOnlyRootFilesystem: keep all writable scratch under the /tmp emptyDir
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      server_tokens off;

      # Allow large query-result uploads/downloads to stream through.
      client_max_body_size {{ .Values.proxy.maxBodySize }};

      # Preserve the original request scheme across proxy hops. If an upstream
      # proxy (e.g. ingress controller / Cloudflare Tunnel) already set
      # X-Forwarded-Proto, keep it so Django still sees the request as HTTPS;
      # otherwise fall back to this hop's scheme.
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
      }

      # Derive the public-facing port from the proto so Django builds correct
      # absolute URLs (e.g. redirects) without leaking the internal container port.
      map $forwarded_proto $forwarded_port {
        https 443;
        default 80;
      }

      # WebSocket support: only send the Upgrade/Connection headers when the
      # client actually requested an upgrade.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      upstream frontend {
        server geoquery.{{ .Release.Namespace }}.svc.cluster.local:80;
      }
      upstream backend {
        server geoquery-backend.{{ .Release.Namespace }}.svc.cluster.local:80;
      }
      {{- if .Values.mcp.enabled }}
      upstream mcp {
        server geoquery-mcp.{{ .Release.Namespace }}.svc.cluster.local:80;
      }
      {{- end }}

      # Preserve the original host and client info so Django can validate
      # CSRF/Host and build correct absolute URLs behind the proxy.
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Port  $forwarded_port;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      server {
        listen {{ .Values.proxy.containerPort }};
        server_name _;

        # Local liveness/readiness endpoint served by nginx itself (never
        # proxied), so proxy health is independent of the upstreams.
        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }

        {{- if .Values.mcp.enabled }}
        # MCP server, on the same hostname as the rest of the app (see
        # values.yaml's mcp comment). The tool endpoint is /mcp; the rest are
        # OAuth routes FastMCP's proxy registers at fixed absolute paths, not
        # nested under any prefix, so each is routed here individually rather
        # than as a group.
        location = /mcp {
          proxy_pass http://mcp;
        }
        location = /authorize {
          proxy_pass http://mcp;
        }
        location = /token {
          proxy_pass http://mcp;
        }
        location = /register {
          proxy_pass http://mcp;
        }
        location = /revoke {
          proxy_pass http://mcp;
        }
        location = /auth/callback {
          proxy_pass http://mcp;
        }
        location = /.well-known/oauth-authorization-server {
          proxy_pass http://mcp;
        }
        location = /.well-known/oauth-protected-resource/mcp {
          proxy_pass http://mcp;
        }
        {{- end }}

        # Regex-matched paths routed to the backend. Evaluated before prefix
        # locations; used for paths that share a prefix with frontend routes
        # but need backend routing for sub-paths with files (e.g. result
        # downloads under /requests/{uuid}/{file}).
        # CORS headers are included so browser clients (Pyodide, Marimo,
        # Jupyter, etc.) can download result files via XHR/fetch.
        {{- range .Values.proxy.regexBackendPaths }}
        location ~ {{ . }} {
          add_header 'Access-Control-Allow-Origin' '*' always;
          add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
          add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;
          proxy_pass http://backend;
        }
        {{- end }}

        # Backend-routed path prefixes (API, admin, and anything else the
        # backend owns). Everything not listed here falls through to the
        # frontend.
        {{- range .Values.proxy.backendPaths }}
        location {{ . }} {
          proxy_pass http://backend;
        }
        {{- end }}

        # Everything else is served by the frontend UI.
        location / {
          proxy_pass http://frontend;
        }
      }
    }
{{- end }}
