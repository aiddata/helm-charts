{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoquery-mcp
  namespace: {{ .Release.Namespace }}
spec:
  # See values.yaml's mcp.replicaCount comment: more than 1 is not yet safe.
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app: geoquery-mcp
  template:
    metadata:
      labels:
        app: geoquery-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.volumes.requests.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.volumes.requests.runAsGroup | default 1000 }}
      containers:
        - name: mcp
          image: {{ .Values.backend.image }}
          # Same image as geoquery-backend, different entrypoint: the MCP
          # server is a second front end onto the same database, not a
          # separate application (see backend/mcp_server/management/commands/run_mcp.py).
          command: ["/app/.venv/bin/python", "manage.py", "run_mcp", "--host", "0.0.0.0", "--port", "8001"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DJANGO_TIME_ZONE
              value: {{ .Values.django.timeZone }}
            {{- include "geoquery.secretEnv" (dict "name" "DJANGO_SECRET_KEY" "ref" .Values.django.secretKey) | nindent 12 }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts }}
            - name: DJANGO_DEBUG
              value: "{{ .Values.django.debug }}"
            # Links the MCP server hands back (finished-export downloads, the
            # /viz visualization) point at the website, not at itself.
            - name: DOWNLOAD_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: FRONTEND_BASE_URL
              value: {{ .Values.django.baseUrl | quote }}
            - name: REQUESTS_DIR
              value: "/requests"
            # Shared rw pooler, same as the other backend-image workloads
            # (processing-worker, background-worker, celery-beat). The
            # dedicated pooler-api Pooler is reserved for geoquery-backend
            # alone -- see database/pooler.yaml.
            - name: PG_RW_HOST
              {{- if .Values.database.pooler.enabled }}
              value: geoquery-db-pooler-rw
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: host
              {{- end }}
            - name: PG_RW_DBNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: dbname
            - name: PG_RW_PORT
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: port
            - name: PG_RW_USER
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: username
            - name: PG_RW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-db-app
                  key: password
            - name: PROTOMAPS_API_KEY
              value: {{ .Values.protomaps.key }}
            - name: RABBITMQ_HOST
              value: "geoquery-rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoquery-rabbitmq-default-user
                  key: password
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
            # The URL a chat client reaches this server at: mcp.baseUrl, or the
            # website's own origin when that is unset (see values.yaml's mcp
            # comment). The OAuth callback and protected-resource metadata are
            # built from it, so it must match the backend's value exactly.
            - name: MCP_BASE_URL
              value: {{ include "geoquery.mcpBaseUrl" . | quote }}
            # This server's client on GeoQuery's own OIDC provider, registered
            # from the same values by the migration Job
            # (ensure_mcp_oidc_client). Browsers sign in at FRONTEND_BASE_URL,
            # the issuer; the token, revocation and JWKS calls go straight to
            # the backend Service instead of back out through the proxy.
            - name: MCP_OIDC_CLIENT_ID
              value: {{ .Values.mcp.oidcClientId | quote }}
            {{- include "geoquery.secretEnv" (dict "name" "MCP_OIDC_CLIENT_SECRET" "ref" .Values.mcp.oidcClientSecret) | nindent 12 }}
            - name: MCP_OIDC_INTERNAL_URL
              value: "http://geoquery-backend.{{ .Release.Namespace }}.svc.cluster.local"
            {{- include "geoquery.secretEnv" (dict "name" "MCP_JWT_SIGNING_KEY" "ref" .Values.mcp.jwtSigningKey) | nindent 12 }}
            # FastMCP's OAuth proxy persists client registrations and upstream
            # GeoQuery tokens under its home directory. /tmp is the one path
            # any runtime UID can write, same reason the Containerfile puts the
            # uv cache there.
            - name: FASTMCP_HOME
              value: /tmp/fastmcp
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          # No HTTP health route is exposed by the MCP server today, so probe
          # the port directly.
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: geoquery-requests
              mountPath: /requests
          ports:
            - name: http
              containerPort: 8001
      volumes:
        - name: tmp
          emptyDir: {}
        - name: geoquery-requests
          persistentVolumeClaim:
            claimName: geoquery-requests
{{- end }}
