{{- if and .Values.mcp.enabled .Values.mcp.persistence.enabled (not .Values.mcp.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoquery-mcp-state
  namespace: {{ .Release.Namespace }}
  {{- with .Values.mcp.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.mcp.persistence.accessModes | nindent 4 }}
  {{- with .Values.mcp.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mcp.persistence.size }}
{{- end }}
