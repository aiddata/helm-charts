{{- if and .Values.networkPolicies.enabled .Values.metrics.enabled .Values.metrics.celery.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celery-monitor-network-policy
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  podSelector:
    matchLabels:
      app: geoquery-celery-monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Flower has no Service; only Prometheus may reach its metrics/health port.
    - from:
        - namespaceSelector:
            {{- toYaml .Values.metrics.networkPolicy.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.metrics.networkPolicy.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.celery.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.dns.namespace }}
          podSelector:
            {{- toYaml .Values.networkPolicies.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geoquery-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
{{- end }}
