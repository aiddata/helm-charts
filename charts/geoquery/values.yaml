frontend:
  image: ghcr.io/aiddata/geoquery-frontend:8c95598
  replicaCount: 1

backend:
  image: ghcr.io/aiddata/geoquery-backend:42a1cbe
  replicaCount: 1
  # import.runAsUser / import.runAsGroup: optional overrides for the pod
  # securityContext of the geoquery-import deployment. Defaults to
  # volumes.requests.runAsUser / runAsGroup. Set these only when the import
  # pod needs a different UID/GID than the other pods mounting the shares,
  # e.g. when the data and requests shares are owned by different users.
  import: {}

# GeoQuery MCP server: a second front end onto the same backend image and
# database (see templates/mcp/) that gives chat clients (Claude, etc.)
# authenticated tool access to GeoQuery data. Disabled by default. Requires
# proxy.enabled.
#
# Sign-in goes through GeoQuery itself, not GitHub directly: the backend runs
# an OpenID Connect provider under /api/idp/ (already covered by the /api
# backend path) and the MCP server's OAuth proxy is its client. A connecting
# chat client is sent to the website's /account page, signs in there (GitHub,
# via geoquery.githubOauth* below) and acts as that same GeoQuery user,
# catalog grants included. There is no second GitHub OAuth App.
#
# Turning this on requires these Secrets in the release namespace:
#   geoquery.oidcPrivateKey  RSA key the provider signs tokens with
#   mcp.oidcClientSecret     shared by the backend and the MCP server
#   mcp.jwtSigningKey        signs the tokens the MCP server issues
# and a backend image with `manage.py ensure_mcp_oidc_client`, which the
# migration Job runs (after migrate and createcachetable) on every install and
# upgrade to register the client.
mcp:
  enabled: false
  # Public URL chat clients reach the MCP server at, including scheme (no
  # trailing slash). This also decides the topology, and with it the URL
  # people actually paste into a chat client:
  #
  # * Empty serves the MCP server on django.baseUrl's hostname, where
  #   geoquery-proxy routes /mcp and the OAuth paths FastMCP's proxy registers
  #   at the root (/authorize, /token, /register, /revoke, /consent,
  #   /auth/callback, /.well-known/oauth-*) to it by path. The tool endpoint
  #   is "/mcp", since the root belongs to the website, so clients connect to
  #   "https://geoquery.org/mcp".
  # * A hostname of its own, e.g. "https://mcp.geoquery.org", makes
  #   geoquery-proxy send every request for that host to the MCP server and
  #   leaves those root paths to the website. The tool endpoint is then served
  #   at "/", so clients connect to "https://mcp.geoquery.org" with nothing
  #   appended. Pointing the hostname at geoquery-proxy is up to you
  #   (exposure.gateway.hostnames, exposure.ingress.hosts, or the tunnel).
  #
  # Changing it moves both the registered redirect URI and the tool endpoint,
  # so connected clients must be reconnected at the new URL.
  baseUrl: ""
  # Any count works. FastMCP's OAuth proxy keeps client registrations,
  # in-flight authorization state and upstream GeoQuery tokens, encrypted, in
  # the mcp_oauth_state table, so an /authorize handled by one pod can finish
  # at /auth/callback on another, and pods are replaced with an ordinary
  # rolling update. Needs a backend image with that table (mcp_server
  # migration 0001); older images kept this state on a single-writer volume.
  # A PodDisruptionBudget keeps one pod up during drains when this is above 1.
  replicaCount: 3
  # Lifetime of the access token FastMCP gives chat clients. The upstream
  # GeoQuery token remains short-lived and is refreshed transparently. Needs a
  # backend image that reads MCP_ACCESS_TOKEN_EXPIRY_SECONDS.
  accessTokenExpirySeconds: 2592000 # 30 days
  # Most connections each pod opens for that OAuth state (asyncpg, opened on
  # demand). They go through the same pooler as the pod's other writes
  # (pooler-tasks when enabled), so they add client connections, not server
  # ones: the pool budget in database.pooler is unchanged.
  statePoolSize: 4
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # The MCP server's client id on GeoQuery's OIDC provider. Not a secret.
  oidcClientId: geoquery-mcp
  # The matching client secret, read by both the backend (which registers the
  # client) and the MCP server. Generate with `openssl rand -base64 48`.
  oidcClientSecret:
    secretName: geoquery-mcp-oidc-client
    key: password
  # Signs the tokens the OAuth proxy issues, and derives the key encrypting
  # its state in mcp_oauth_state and the key sealing submit_request's
  # confirmation round trip. Every replica reads the same Secret, which is
  # what lets them share that state. Must be stable across restarts --
  # rotating it invalidates every issued token and forces every client to
  # re-register. Keep mcp.oidcClientSecret and
  # geoquery.oidcPrivateKey stable too. The chart only reads this from the
  # Secret; never generate it during deployment.
  # Generate with `openssl rand -base64 48`.
  jwtSigningKey:
    secretName: geoquery-mcp-jwt-signing-key
    key: password

# Reverse proxy that fronts the app. It is the single service external
# traffic (see exposure below) is routed to, and it forwards each request to
# either the frontend (UI) or the backend (API/admin) based on the path.
proxy:
  enabled: true
  image: nginxinc/nginx-unprivileged:1.27-alpine
  replicaCount: 2
  # Port nginx listens on inside the container. Must be >1024 so the
  # non-root container can bind it.
  containerPort: 8080
  # Maximum request body size; lets large uploads/downloads stream through.
  maxBodySize: "100m"
  # Path prefixes routed to the backend service. Every request whose path
  # does not start with one of these is served by the frontend. Adjust to
  # match your app's URL layout — e.g. add "/static/" and "/media/" if the
  # backend serves the Django admin's assets.
  # Regex patterns routed to the backend. Evaluated before backendPaths
  # prefix matches; use for paths that share a prefix with frontend routes
  # but need backend routing only for deeper sub-paths.
  regexBackendPaths:
    # Route result files (e.g. /requests/{uuid}/file.zip) to the backend
    # while leaving the frontend page (/requests/{uuid}/) on the frontend.
    - "^/requests/[^/]+/.+"
  backendPaths:
    - /admin
    - /api
    - /data
    - /static
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

# Exposure configuration (how the app is exposed externally)
# type: "none" | "ingress" | "gateway" | "custom"
#   - none: No ingress resources created, no external traffic allowed
#   - ingress: Traditional Kubernetes Ingress resource
#   - gateway: Gateway API HTTPRoute resource
#   - custom: No resources created, but allows traffic from custom sources (bring your own ingress/gateway)
exposure:
  type: none

  # Traditional Kubernetes Ingress configuration (used when type: ingress)
  ingress:
    className: "" # e.g., "nginx", "traefik"
    annotations: {}
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: geoquery.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: geoquery-tls
    #    hosts:
    #      - geoquery.example.com
    # Network policy: which pods can send traffic to the frontend
    networkPolicy:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx

  # Gateway API configuration (used when type: gateway)
  gateway:
    # Reference to an existing Gateway resource
    parentRefs:
      - name: eg
        namespace: envoy-gateway-system
    hostnames:
      - geoquery.example.com
    # Network policy: which pods can send traffic to the frontend
    networkPolicy:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: eg

  # Custom configuration (used when type: custom)
  # Use this when you manage your own Ingress/Gateway resources outside this chart
  custom:
    # Network policy peers that should be allowed to reach the frontend
    networkPolicy: []
    # - namespaceSelector:
    #     matchLabels:
    #       custom-label: value
    #   podSelector:
    #     matchLabels:
    #       app: custom-proxy

# Network Policies for securing pod-to-pod and external communication
networkPolicies:
  enabled: false

  # External API egress configuration
  externalEgress:
    # If true, allows all external egress (0.0.0.0/0)
    # If false, only allows egress to specified CIDRs
    allowAll: true
    # Specific CIDRs to allow when allowAll is false
    # cidrs:
    #   - cidr: 0.0.0.0/0
    #     ports:
    #       - port: 443
    #         protocol: TCP

  # Kubernetes API server endpoint (needed by CNPG pods to query cluster resources)
  # Use the actual API server endpoint IP, not the kubernetes ClusterIP —
  # NetworkPolicy ipBlock rules are evaluated after DNAT, so the ClusterIP
  # (e.g. 10.43.0.1) won't match. Find it with: kubectl get endpoints kubernetes -n default
  kubeApiServer:
    cidr: "172.30.0.11/32"
    port: 6443

  # DNS egress (required for all pods to resolve service names)
  dns:
    # Namespace where CoreDNS/kube-dns runs
    namespace: kube-system
    # Labels to select DNS pods
    podSelector:
      matchLabels:
        k8s-app: kube-dns

  # Namespace where the CNPG operator is installed
  cnpgOperator:
    namespace: cnpg-system

  # Namespace where the RabbitMQ cluster operator is installed
  rabbitmqOperator:
    namespace: rabbitmq-system

  # Namespace where the KEDA operator is installed. Only used when
  # tasks.processing.autoscaling is enabled: the operator polls the pending
  # task count over PostgreSQL from its own namespace, so it needs an ingress
  # exception on whichever pooler (or the cluster itself) it reads through.
  kedaOperator:
    namespace: keda

tasks:
  background:
    replicaCount: 3
    # Celery prefork pool size. Without an explicit value Celery defaults to
    # one process per CPU core, which on large nodes forks dozens of
    # Django-loaded processes and multiplies idle memory accordingly.
    concurrency: 4
    # How many build_extract_tasks_worker tasks one build wave fans
    # out to (N_EXTRACT_TASK_BUILDERS). Each holds a pooler connection for
    # its whole INSERT batch, so more builders trade extract throughput for
    # build-out speed.
    extractTaskBuilders: 1
    # Newly created extract tasks per INSERT transaction
    # (EXTRACT_TASK_BUILD_BATCH_SIZE). Must be positive. Also used by
    # management commands in the backend pod.
    extractTaskBuildBatchSize: 5000
    # Newly created tasks per builder invocation (EXTRACT_TASK_BUILD_MAX_TASKS).
    # 0 means unlimited. Each global builder gets its own budget; the
    # non-global branch has a separate budget. The backend management command
    # shares one budget across its global and non-global branches.
    extractTaskBuildMaxTasks: 0
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  processing:
    replicaCount: 8
    concurrency: 16
    # Extract tasks one claim takes: the chunk a worker process runs before
    # claiming again (EXTRACT_TASK_CLAIM_BATCH). Keep claimBatch x the mean
    # task time well under the 30-minute stale-task reaper; the dashboard's
    # Chunk Duration panel shows how close it gets.
    claimBatch: 64
    # run_extract_worker --max-chunks-per-child. This counts chunks, not
    # extract tasks, so a process lives for roughly maxTasksPerChild *
    # claimBatch tasks before it is recycled. Lower it when raising claimBatch
    # so memory that creeps up per task (rasterio/GDAL) is still reclaimed as
    # often.
    maxTasksPerChild: 1000
    # Seconds a worker process waits after finding no pending tasks before
    # claiming again (EXTRACT_WORKER_IDLE_SECONDS). Also the longest a new
    # request's tasks wait for an idle worker to notice them.
    idleSeconds: 60
    # On SIGTERM each process finishes its current task and releases the rest
    # of its chunk, so this only needs to cover the slowest single task.
    terminationGracePeriodSeconds: 300
    # Requests only, no limits. A processing task's CPU and memory use swing
    # widely with the size of the query, so a limit would either throttle a
    # pod that has idle cores available to it or OOM-kill a legitimately
    # large query. The CPU request is deliberately well below what a busy pod
    # actually uses: most concurrency slots sit blocked on Postgres, NFS or an
    # external API rather than on CPU, and with no limit a pod is free to burst
    # into whatever the node has idle. It is a scheduling floor, not a budget.
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
    # Node affinity for the processing-worker pods, rendered verbatim as the
    # pod's spec.affinity.nodeAffinity. Same shape as database.affinity's
    # nodeAffinity example.
    nodeAffinity: {}
    # Backlog-driven autoscaling via KEDA. Requires the KEDA operator (keda.sh
    # CRDs) in the cluster. When enabled the ScaledObject owns the replica
    # count and replicaCount above is ignored.
    #
    # The signal is the number of pending rows in extract_tasks, read from
    # PostgreSQL: the extract worker claims its work from that table directly,
    # so it is the queue. The count query is backed by a partial index on
    # status = 0 (analytics migration 0014).
    autoscaling:
      enabled: false
      # Keep a floor of warm workers: the backend image loads Django on start,
      # so a cold pod is not useful for the first several seconds.
      minReplicas: 2
      # Ceiling. Size this against downstream capacity, not node capacity --
      # maxReplicas * concurrency is the number of tasks that will hit the rw
      # pooler and the external APIs at once.
      maxReplicas: 12
      # Pending tasks per replica. The HPA targets ceil(pending / this), so
      # with the defaults above: 12 pods above 6000 pending, 6 at 3000, and
      # the floor of 2 once the backlog is under 1000. Set it from how far
      # down the backlog should get before workers start being shed.
      pendingTasksPerReplica: 5000
      # How often KEDA runs the count query. The result is cached and served
      # to the HPA on its own sync cycle, so this is the only place the
      # database is polled from.
      pollingInterval: 30
      # Idle time before scaling to zero. Only applies when minReplicas is 0
      # and is omitted from the ScaledObject otherwise, since KEDA warns that
      # it is inert.
      cooldownPeriod: 300
      # Connection details for the count query. userName and dbName match
      # what CloudNativePG bootstraps by default; the password comes from the
      # geoquery-db-app Secret via a TriggerAuthentication. The host is
      # chosen automatically: the ro pooler when enabled (a slightly stale
      # count from a replica is fine here), else the rw pooler, else the
      # cluster's primary service.
      postgres:
        userName: app
        dbName: app
        # Passed straight through to the driver. CNPG poolers accept TLS, so
        # "prefer" negotiates it when offered without failing when not.
        sslmode: prefer
      scaleUp:
        podsPerPeriod: 1
        periodSeconds: 60
      scaleDown:
        # Backlog must stay low for this long before any pod is removed.
        stabilizationWindowSeconds: 600
        periodSeconds: 300
  beat:
    enabled: true
    # Seconds between build triggers (EXTRACT_TASK_BUILD_INTERVAL_SECONDS).
    # Must be positive. Healthy global waves reject overlapping launches.
    # Crashed-wave recovery can take the stale window plus one interval;
    # fresh Beat schedule state also delays the first trigger by one interval.
    extractTaskBuildIntervalSeconds: 600

rabbitmq:
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    # No memory limit: RabbitMQ manages its own memory high-watermark, and a
    # hard limit risks OOM-killing a broker mid-flight.
    limits:
      cpu: 500m

django:
  timeZone: "UTC"
  # Sensitive settings are read from Secrets you create in the release
  # namespace, not from these values — nothing secret belongs in a values file
  # or in the Helm release history. Each entry names an existing Secret and the
  # key inside it, e.g.
  #   kubectl create secret generic geoquery-secret-key \
  #     --namespace <release namespace> --from-literal=password=<value>
  # Clearing secretName leaves the corresponding environment variable unset in
  # the containers, which is how an optional setting is disabled.
  secretKey:
    secretName: geoquery-secret-key
    key: password
  debug: "false"
  allowedHosts: <ALLOWED HOSTS>
  # Comma-separated origins Django trusts for unsafe (POST) requests behind the
  # TLS-terminating proxy (Cloudflare Tunnel). Each must include the scheme,
  # e.g. "https://geoquery.org". Required for admin login POSTs. Empty disables.
  csrfTrustedOrigins: ""
  # Public base URL of the deployment, including scheme (no trailing slash).
  # Used by the backend to build absolute links (e.g. result downloads and
  # links back to the frontend). Populates DOWNLOAD_BASE_URL and
  # FRONTEND_BASE_URL.
  baseUrl: "https://geoquery.org"

geoquery:
  directories: "false"
  # Secret-backed settings, in the same {secretName, key} form as
  # django.secretKey above.
  emailPassword:
    secretName: geoquery-email
    key: password
  # Optional: only needed for the gist export feature.
  githubGistToken:
    secretName: geoquery-gist
    key: password
  # GitHub OAuth app credentials, needed for GitHub login.
  # Both keys usually live in one Secret, e.g.
  githubOauthClientId:
    secretName: geoquery-github-oauth
    key: clientId
  githubOauthClientSecret:
    secretName: geoquery-github-oauth
    key: clientSecret
  # RSA private key (PEM) that GeoQuery's OIDC provider signs MCP sign-in
  # tokens with. Only read when mcp.enabled. Create it with e.g.
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > key.pem
  #   kubectl create secret generic geoquery-oidc-private-key \
  #     --namespace <release namespace> --from-file=password=key.pem
  # Replacing it invalidates every issued token, so MCP clients must reconnect.
  oidcPrivateKey:
    secretName: geoquery-oidc-private-key
    key: password

# Shared NFS-backed volumes mounted by pods across the chart
volumes:
  # geoquery-data: read-only NFS pool of source datasets
  data:
    storageClassName: nfs-csi
    size: 100Gi
    # NFS server hostname/address and the exported share path
    server: 128.239.59.130
    share: <SHARE PATH>
    # Optional sub-directory under the share to mount (empty = share root)
    subDir: ""
    mountOptions:
      - hard
      - nfsvers=4.1
  # geoquery-requests: read-write NFS pool for generated query results
  requests:
    storageClassName: nfs-csi
    size: 100Gi
    server: 128.239.59.130
    share: <SHARE PATH>
    subDir: ""
    mountOptions:
      - hard
      - nfsvers=4.1
    # UID/GID that owns the share on the NFS server. Every pod mounting
    # /requests (backend, background worker, import) runs as this user:
    # ownership on NFS is enforced by the server and fsGroup does not apply
    # to it, so a pod whose UID does not match cannot write results.
    runAsUser: 1000
    runAsGroup: 1000

database:
  replicas: 3
  storage:
    # Environments override this. Declare size explicitly in the overlay rather
    # than inheriting this default: the spec is what a NEW instance is
    # provisioned with, so a replaced replica inheriting a too-small default
    # cannot hold the database -- see aiddata/geoquery, docs/get-involved/contributing/dev/database.md (section 10).
    storageClass: nfs-csi
    size: 50Gi
  # Scheduling constraints for the PostgreSQL instance pods. Passed through
  # verbatim to the CNPG Cluster's spec.affinity, which accepts nodeSelector,
  # nodeAffinity, tolerations, podAntiAffinityType and topologyKey. Use this to
  # pin the database to nodes with fast storage/network, e.g.
  #   affinity:
  #     nodeAffinity:
  #       requiredDuringSchedulingIgnoredDuringExecution:
  #         nodeSelectorTerms:
  #           - matchExpressions:
  #               - key: kubernetes.io/hostname
  #                 operator: In
  #                 values: [node-a, node-b, node-c]
  affinity: {}
  # CPU/memory for each PostgreSQL instance pod. Unset by default; set
  # requests equal to limits in production so the pod gets Guaranteed QoS and
  # is never evicted under node memory pressure. Size postgresql.parameters
  # below to match (shared_buffers ~25% of memory, effective_cache_size ~75%).
  #   resources:
  #     requests: {cpu: "4", memory: 16Gi}
  #     limits: {cpu: "4", memory: 16Gi}
  resources: {}
  postgresql:
    # Rendered verbatim into the CNPG Cluster's postgresql.parameters. CNPG
    # requires every value to be a string, so quote numbers. Overriding this
    # map replaces it wholesale; copy the entries you want to keep.
    # Defaults assume SSD-backed block storage (e.g. Ceph RBD) and a pod with
    # roughly 16Gi of memory. Changing shared_buffers, wal_buffers or any
    # pg_stat_statements.* setting triggers a CNPG rolling restart.
    #
    # Before tuning the write path, read aiddata/geoquery,
    # docs/get-involved/contributing/dev/database.md (section 6 and appendix B).
    # This cluster is write-bandwidth bound, not lock bound, and two obvious
    # levers have already been tested and measured: commit_delay reduced lock
    # waiters but cost 17% throughput and is deliberately left at 0.
    parameters:
      # Keep long read-only queries on the replicas (served by the ro pooler)
      # from being cancelled with "conflict with recovery" during WAL replay
      hot_standby_feedback: "on"
      max_standby_streaming_delay: "30s"
      # Django (USE_TZ) expects "UTC"; the default "Etc/UTC" doesn't string-match,
      # so Django issues a SET TIME ZONE on every new connection. Under
      # transaction pooling that's a wasted round trip per request.
      timezone: "UTC"
      # Memory. The CNPG default shared_buffers (~160MB) cannot cache a
      # multi-GB database; most reads went to disk.
      shared_buffers: "4GB"
      effective_cache_size: "12GB"
      work_mem: "16MB"
      maintenance_work_mem: "512MB"
      # WAL and checkpoints. The extract-task workload is many tiny write
      # transactions; a small wal_buffers fills constantly and an undersized
      # max_wal_size forces checkpoints by volume, each one emitting a burst
      # of full-page images.
      #
      # A *requested* checkpoint (one triggered by hitting max_wal_size) ignores
      # checkpoint_completion_target and writes flat out, after which every
      # page's first touch emits another full-page image and refills WAL sooner
      # -- the loop is self-reinforcing. Measured on prod over 120h at 4GB:
      # 899 of 1002 checkpoints forced by volume (89.7%), 601.6M full-page
      # images, 2,530 GB of WAL, 95h of checkpointer write time. Raising the
      # ceiling to 16GB cut that to 12 forced / 1 timed, made a 136.8M-row
      # extract_tasks reset run 2.06x faster, and took steady-state processing
      # from 1.42M to 4.5M tasks/hr.
      #
      # 8GB is the default because WAL is charged three times over: each CNPG
      # instance keeps its own pg_wal on its own PVC, so the delta from 1GB
      # costs 3x that in pool space, and prod + staging share one ceph pool.
      # PROD OVERRIDES THIS TO 16GB in its environment overlay -- see
      # docs/get-involved/contributing/dev/database.md section 10. Size any
      # increase against `ceph df` (MAX AVAIL), not filesystem free space.
      wal_buffers: "64MB"
      max_wal_size: "8GB"
      min_wal_size: "4GB"
      checkpoint_timeout: "15min"
      checkpoint_completion_target: "0.9"
      wal_compression: "lz4"
      # Planner/IO costs for SSD block storage (defaults assume spinning disks).
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      # Query statistics. shared_preload_libraries is operator-managed and
      # cannot be set here; CNPG adds pg_stat_statements to it (and creates
      # the extension) whenever any pg_stat_statements.* GUC is present.
      pg_stat_statements.track: "top"
      pg_stat_statements.max: "10000"
  # PgBouncer connection poolers (CloudNativePG Pooler CRD).
  # rw fronts the primary and serves every workload except the migration Job.
  # ro fronts the replicas and serves read-only queries from the backend,
  # background-worker and MCP server, so their reads don't compete with
  # writes from the processing tasks.
  pooler:
    enabled: true
    # session | transaction. transaction multiplexes best but requires
    # DISABLE_SERVER_SIDE_CURSORS in the backend's Django settings.
    poolMode: transaction
    parameters:
      # The reasoning behind these numbers -- why the budget must stay under
      # max_connections, why transaction pooling makes long transactions
      # disproportionately expensive, and why pool saturation is not always a
      # capacity problem -- is documented in aiddata/geoquery, docs/get-involved/contributing/dev/database.md (section 5).
      #
      # Client-side connection ceiling, per pooler pod.
      max_client_conn: "500"
      # Server connections per pool, per pooler pod. Total connections to the
      # primary across every rw-type pooler (rw + api + tasks, below -- ro
      # targets the replicas and draws on their max_connections, not the
      # primary's) must stay well
      # under PostgreSQL's max_connections (100 by default), with headroom
      # left for direct/admin/migration connections -- see the incident where
      # a migration Job couldn't get a connection because the poolers alone
      # were already close to max_connections. Only raise this once commits
      # are cheap (SSD-backed storage); on slow fsync it just deepens the
      # queue behind the WAL lock.
      #
      # rw + ro used to both default to 30 (2 instances each = 120
      # theoretical max, before api existed at all). Trimmed to 20 here to
      # make room for the dedicated api pool without raising the combined
      # ceiling.
      default_pool_size: "20"
      # Inert today: the backend runs psycopg 3 with client-side binding
      # (server_side_binding unset), and the MCP server's asyncpg pool has its
      # statement cache disabled, so neither prepares named statements. Needed
      # if either ever does.
      max_prepared_statements: "100"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Node affinity for the pooler pods, rendered alongside the built-in pod
    # anti-affinity. Poolers proxy every query to the primary, so keep them on
    # the same network fabric as the database (see database.affinity).
    nodeAffinity: {}
    rw:
      instances: 2
    ro:
      # Requires database.replicas > 1 — the geoquery-db-ro service selects
      # replicas only and has no endpoints on a single-instance cluster.
      # Replication is asynchronous, so reads here may be slightly stale;
      # the backend's database router decides what is safe to send.
      enabled: true
      instances: 2
    api:
      # A separate rw Pooler used only by geoquery-backend (see
      # backend-deployment.yaml's PG_RW_HOST). processing-worker,
      # celery-beat and geoquery-import keep using the shared pooler-rw
      # above; background-worker and geoquery-mcp have their own pool, see
      # tasks below. Since this is a distinct PgBouncer
      # process with its own connection budget to the primary, the API's
      # slots here can't be exhausted by extraction/processing load, however
      # busy that gets -- that isolation was missing before: every component
      # shared one pool, so a saturated processing load could (and did)
      # starve ordinary site requests of a connection.
      enabled: true
      instances: 2
      parameters:
        # Deliberately small: the API's own connections are quick page/tile
        # requests, not the sustained bulk work processing does, so it
        # doesn't need a large pool -- just one that's never contended by
        # other components. Tune up if this pool is ever seen queuing
        # (SHOW POOLS in the pooler-api pod).
        default_pool_size: "10"
    tasks:
      # A separate rw Pooler for the request path: background-worker (request
      # materialization and the completion sweep) and geoquery-mcp. Same
      # reasoning as api above, applied to the other latency-sensitive
      # components -- they were left on the shared pooler-rw alongside
      # processing-worker, and got starved by it.
      #
      # Measured 2026-10-01, mid-backlog with processing-worker at 16 replicas
      # x 16 concurrency (256 task slots) against pooler-rw's 50 server slots:
      # SHOW POOLS reported sv_active=25 (the full pool) with 0 idle and 139
      # clients queued on one pooler-rw pod. Materializing one request's 1,935
      # extract tasks took 11m56s while consuming 691ms of actual database
      # time -- ~99.9% of it queueing for a slot. The same contention applies
      # to MCP, which is a user-facing endpoint.
      #
      # This does not fix the underlying N+1 in services._build_tasks (one
      # get-or-create round trip per task rather than a bulk insert per
      # dataset); it stops that N+1 from competing with bulk extraction for
      # connections. Fix both -- the pool protects the whole request path
      # including MCP, the bulk insert makes materialization fast on its own.
      enabled: true
      instances: 2
      parameters:
        # Small for the same reason as api: this path is many short
        # transactions needing low latency, not sustained bulk throughput.
        # The problem it solves is contention, not throughput -- the clients
        # are ~6 background-worker pods plus geoquery-mcp, so roughly 8
        # concurrent short transactions, against the 139-deep queue they sat
        # in on the shared pool. Watch for queueing via the pooler pod's
        # metrics endpoint (cnpg_pgbouncer_pools_cl_waiting on :9127/metrics)
        # before raising it.
        #
        # Budget, primary-facing only. The ro pool does not count: type: ro
        # targets the replicas, each with their own max_connections.
        #
        #   chart defaults:   rw 2x20=40 + api 2x10=20 + tasks 2x5=10 => 70
        #   prod (shared 25): rw 2x25=50 + api 2x10=20 + tasks 2x5=10 => 80
        #
        # against max_connections=100, leaving 20-30 for direct, admin and
        # migration Job connections -- an incident is on record where a
        # migration Job could not get one because the poolers had taken them
        # all. Deliberately 5 rather than 10 so that an environment raising
        # the shared default_pool_size (as prod does) still lands at 80 and
        # does not have to redo this arithmetic to stay safe.
        #
        # If this pool ever does need to be bigger, take the slack from api
        # rather than rw: api was measured completely idle (cl_active=0,
        # sv_idle=1) through the contention incident that motivated this
        # pool, while rw sizing governs extraction throughput.
        default_pool_size: "5"
  backup:
    enabled: false
    schedule: "0 0 0,12 * * *"
    retentionPolicy: "30d"
    objectStoreName: my-backup-store
    s3Credentials:
      destinationPath: s3://backup-bucket-name
      endpointUrl: https://s3.zone.example.com
      accessKeyId:
        name: cnpg-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup
        key: SECRET_ACCESS_KEY
  recover:
    enabled: false
    objectStoreName: my-recover-store
    s3Credentials:
      destinationPath: s3://recover-bucket-name
      endpointUrl: https://s3.zone.example.com
      accessKeyId:
        name: cnpg-recover
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-recover
        key: SECRET_ACCESS_KEY

protomaps:
  key: MY_PROTOMAPS_KEY

# Prometheus metrics configuration
metrics:
  enabled: false
  path: "/metrics"

  # PodMonitor resources. Requires the Prometheus Operator CRDs
  # (monitoring.coreos.com) to be installed, and the master metrics.enabled
  # switch above to be true. When enabled:
  #   - a PodMonitor is created for the backend pods so Prometheus scrapes
  #     the django-prometheus endpoint on the dedicated metrics port (9091)
  #   - a PodMonitor is created for the processing workers so Prometheus
  #     scrapes the extract task metrics (geoquery_extract_*), also on 9091
  #   - a PodMonitor is created for background workers (9091), exporting
  #     background job progress and request completion metrics
  #   - a PodMonitor is created for the database instances so Prometheus can
  #     scrape the PostgreSQL metrics endpoint (port 9187), labelled with
  #     role=primary|replica. metrics.enabled also adds the custom queries in
  #     templates/database/monitoring-queries.yaml to that endpoint
  #     (cnpg_geoquery_*: wait events, extract table counters, task state
  #     estimates, requests by status, pg_stat_io, top statements)
  #   - one PodMonitor covers every PgBouncer pooler, scraping the
  #     cnpg_pgbouncer_* metrics endpoint (port 9127) with a pooler=rw|ro|api|tasks label
  #   - two PodMonitors are created for the RabbitMQ cluster, both scraping the
  #     rabbitmq_prometheus endpoint (port 15692): one for the aggregated
  #     node-level metrics, one for the per-queue depths on /metrics/detailed
  podMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    labels: {}

  # Ships charts/geoquery/dashboards/geoquery.json as a ConfigMap for the
  # Grafana sidecar to pick up. Requires metrics.enabled above. The dashboard
  # reads the series the PodMonitors above scrape — mostly django-prometheus,
  # plus cnpg_pgbouncer_* for Connection Pooling, rabbitmq_detailed_queue_*
  # for Task Queues, geoquery_extract_* for Extract Tasks, and cnpg_* (including
  # the custom cnpg_geoquery_* queries) for Database Write Path and Extract
  # Task State — so it is only useful where those PodMonitors are also running.
  grafanaDashboard:
    enabled: true

    # Dashboard identity. Both default to being namespace-scoped so that
    # installing the chart into staging and production yields two separate
    # dashboards rather than two releases fighting over one uid.
    #   uid   -> "geoquery-<namespace>"
    #   title -> "GeoQuery (<namespace>)"
    uid: ""
    title: ""

    # Label the Grafana sidecar watches for. Match this to the sidecar's
    # `sidecar.dashboards.label` / `labelValue` settings.
    label:
      key: grafana_dashboard
      value: "1"
    extraLabels: {}

    # Where to create the ConfigMap. Empty means the release namespace, which is
    # right when the sidecar watches all namespaces (the kube-prometheus-stack
    # default). Set this to the Grafana namespace if the sidecar is scoped.
    namespace: ""

  networkPolicy:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus

  prometheusRule:
    enabled: false # Enable when you want alerting
    namespace: ""
    labels: {}
